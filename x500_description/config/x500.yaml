# X500 build-time configuration (accessory loadout).
#
# Topic namespace: flight-sensor topics publish at /<topic_namespace>/{imu,
# air_pressure,mag,gps}. The composed Gazebo model AND the ros_gz bridge config
# regenerate from this file on rebuild, so topics always match.
#
# extra_bridge_topics: optional top-level list, appended VERBATIM to the
# generated bridge config in native ros_gz_bridge syntax (e.g. the motor
# command bus). Never hand-edit the generated ros_gz_bridge.yaml.
topic_namespace: x500
# Edit this file and rebuild (colcon build) to regenerate the URDF.
#
# `type` must match a macro in urdf/accessories.xacro; xyz/rpy are the mount pose
# relative to base_link (metres / radians). The list below is a demo loadout that
# shows the whole catalog at once; replace with your real loadout. Masses feed
# the vehicle CG (base_link is the bare airframe), so poses matter for balance.
accessories:
  - {type: battery,            name: battery,   xyz: "0 0 -0.045",    rpy: "0 0 0"}
  - {type: companion_computer, name: companion, xyz: "-0.05 0 0.045", rpy: "0 0 0"}
  - {type: gps_mast,           name: gps,       xyz: "-0.11 0 0.045", rpy: "0 0 0"}
  - {type: gimbal,             name: gimbal,    xyz: "0.12 0 -0.05",  rpy: "0 0 0"}
